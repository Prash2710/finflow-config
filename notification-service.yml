server:
  port: 8085

spring:
  application:
    name: notification-service

  mail:
    host: localhost
    port: 25

    username:
    password:

    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.finflow.notification_service: DEBUG
