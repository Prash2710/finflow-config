server:
  port: 8080

spring:
  application:
    name: api-gateway

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    gateway:
      routes:

        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

jwt:
  secret: 7h1rM6xP1xq+3q5wR0M0Q4P1HhQxgM5o6z6N8YtYQYg=
  expiration: 86400000
